name: offline-checks

on:
  pull_request:
  push:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: "! rg -n -i '(api[_-]?key|service[_-]?role|password|secret|token)\\s*[:=]' runtime/artifacts 2>/dev/null"
      - run: git diff --check
