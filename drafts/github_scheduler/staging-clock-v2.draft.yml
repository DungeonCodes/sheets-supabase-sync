# REVISION 2, 2026-10-20. Previous draft preserved as historical evidence.
# REVIEW DRAFT ONLY. Not loaded by Actions from drafts/.
# No schedule expression is selected: client cadence/SLA requirements are pending.
# Future publication/one manual test/recurrence each need separate human approval.
name: staging-clock

on:
  workflow_dispatch:
    inputs:
      confirm_dispatch:
        description: Explicit approval for one controlled dispatch attempt
        type: boolean
        required: true
        default: false
      expected_dev_sha:
        description: Reviewed dev commit; freeze dev during the controlled test
        type: string
        required: true
      approval_expires_at:
        description: UTC ISO expiry within 15 minutes; controlled-test window only
        type: string
        required: true

permissions: {}

concurrency:
  group: staging-clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      # No checkout, third-party action, environment, Supabase or Google credential.
      - name: Validate clock and dispatch once to dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_ENABLED: ${{ vars.STAGING_CLOCK_ENABLED }}
          CONFIRM_DISPATCH: ${{ inputs.confirm_dispatch }}
          EXPECTED_DEV_SHA: ${{ inputs.expected_dev_sha || vars.STAGING_CLOCK_EXPECTED_DEV_SHA }}
          APPROVAL_EXPIRES_AT: ${{ inputs.approval_expires_at || vars.STAGING_CLOCK_APPROVAL_EXPIRES_AT }}
        run: |
          set -euo pipefail
          node --input-type=module <<'CLOCK_JS'
          // CLOCK_PROGRAM_BEGIN -- offline tests execute this exact program with mocked fetch.
          const env = process.env;
          const repository = 'DungeonCodes/sheets-supabase-sync';
          const workflow = 'scheduled-sync.yml';
          const prefix = `/repos/${repository}`;
          const workflowPath = `${prefix}/actions/workflows/${workflow}`;
          const activeStates = new Set(['queued','in_progress','waiting','pending','requested']);
          let dispatchAttempted = false;
          let acceptedRunId = null;
          function stop(code) { const error = new Error('clock_stopped'); error.clockCode = code; throw error; }
          function approvedWindow() {
            const expiry = Date.parse(env.APPROVAL_EXPIRES_AT);
            const remaining = expiry-Date.now();
            if (!Number.isFinite(expiry) || remaining<=0 || remaining>900000) stop('APPROVAL_WINDOW_INVALID');
          }
          async function api(path, method='GET', body) {
            let response;
            try {
              response = await fetch(`https://api.github.com${path}`, {
                method, redirect:'error', signal:AbortSignal.timeout(10000),
                headers: {
                  Authorization:`Bearer ${env.GH_TOKEN}`, Accept:'application/vnd.github+json',
                  'Content-Type':'application/json', 'X-GitHub-Api-Version':'2026-03-10',
                },
                ...(body ? {body:JSON.stringify(body)} : {}),
              });
            } catch { stop(dispatchAttempted ? 'DISPATCH_OR_OBSERVATION_UNCERTAIN' : 'PREFLIGHT_TRANSPORT_FAILED'); }
            if (response.status!==200) stop(dispatchAttempted ? 'DISPATCH_OR_OBSERVATION_UNCERTAIN' : 'PREFLIGHT_HTTP_FAILED');
            try { return await response.json(); }
            catch { stop(dispatchAttempted ? 'DISPATCH_OR_OBSERVATION_UNCERTAIN' : 'PREFLIGHT_RESPONSE_INVALID'); }
          }
          async function runClock() {
            if (env.GITHUB_REPOSITORY!==repository || env.GITHUB_REF!=='refs/heads/main') stop('WRONG_REPOSITORY_OR_REF');
            if (!['workflow_dispatch','schedule'].includes(env.GITHUB_EVENT_NAME)) stop('WRONG_EVENT');
            if (env.GITHUB_RUN_ATTEMPT!=='1') stop('RERUN_FORBIDDEN');
            if (!/^\d+$/.test(env.GITHUB_RUN_ID??'')) stop('RUN_ID_INVALID');
            if (env.CLOCK_ENABLED!=='true') stop('CLOCK_DISABLED');
            if (env.GITHUB_EVENT_NAME==='workflow_dispatch' && env.CONFIRM_DISPATCH!=='true') stop('CONFIRMATION_REQUIRED');
            if (!/^[0-9a-f]{40}$/.test(env.EXPECTED_DEV_SHA??'')) stop('EXPECTED_SHA_INVALID');
            if (!env.GH_TOKEN) stop('AUTOMATIC_TOKEN_MISSING');
            approvedWindow();
            const target = await api(workflowPath);
            if (target.state!=='active' || target.path!=='.github/workflows/scheduled-sync.yml' ||
                !Number.isSafeInteger(target.id) || target.id<=0) stop('TARGET_WORKFLOW_INVALID');
            const branch = await api(`${prefix}/git/ref/heads/dev`);
            if (branch.object?.type!=='commit' || branch.object.sha!==env.EXPECTED_DEV_SHA) stop('DEV_REVISION_CHANGED');
            let complete = false;
            for (let page=1;page<=10;page++) {
              const list = await api(`${workflowPath}/runs?branch=dev&per_page=100&page=${page}`);
              if (!Array.isArray(list.workflow_runs)) stop('RUN_LIST_INVALID');
              if (list.workflow_runs.some(run=>run.head_branch==='dev' && activeStates.has(run.status))) {
                console.log(JSON.stringify({status:'busy_skip',clock_run_id:env.GITHUB_RUN_ID}));
                return;
              }
              if (list.workflow_runs.length<100) { complete=true;break; }
            }
            if (!complete) stop('CONCURRENCY_STATE_UNKNOWN');
            approvedWindow();
            dispatchAttempted=true; // Never clear this and never retry the POST.
            const result = await api(`${workflowPath}/dispatches`,'POST',{ref:'dev'});
            const id = result.workflow_run_id;
            if (!Number.isSafeInteger(id) || id<=0 ||
                result.run_url!==`https://api.github.com${prefix}/actions/runs/${id}` ||
                result.html_url!==`https://github.com/${repository}/actions/runs/${id}`) stop('DISPATCH_RESPONSE_AMBIGUOUS');
            acceptedRunId=id;
            const run = await api(`${prefix}/actions/runs/${id}`);
            if (run.id!==id || run.workflow_id!==target.id || run.event!=='workflow_dispatch' ||
                run.head_branch!=='dev' || run.head_sha!==env.EXPECTED_DEV_SHA || run.run_attempt!==1) stop('DISPATCH_IDENTITY_MISMATCH');
            // This proves acceptance/identity, NOT environment deployment or Python success.
            console.log(JSON.stringify({status:'dispatch_accepted_not_completed',
              clock_run_id:env.GITHUB_RUN_ID,target_run_id:id,target_url:result.html_url,
              expected_dev_sha:env.EXPECTED_DEV_SHA}));
          }
          try { await runClock(); }
          catch (error) {
            // Only codes thrown locally; never print HTTP bodies, token or error message.
            const code = error?.message==='clock_stopped' ? error.clockCode : 'UNEXPECTED_CLOCK_FAILURE';
            console.error(JSON.stringify({status:'blocked_or_ambiguous',code,
              dispatch_attempted:dispatchAttempted,accepted_run_id:acceptedRunId,
              clock_run_id:/^\d+$/.test(env.GITHUB_RUN_ID??'')?env.GITHUB_RUN_ID:null}));
            process.exitCode=1;
          }
          // CLOCK_PROGRAM_END
          CLOCK_JS
