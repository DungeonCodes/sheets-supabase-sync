[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sheets-supabase-sync"
version = "0.1.0"
description = "Sincronizador auditavel de planilhas para Supabase."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sheets-supabase-sync = "sheets_supabase_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
